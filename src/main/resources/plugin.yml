name: SponsorPerks
version: '1.3'
main: fun.wardensmp.sponsorperks.SponsorPerks
api-version: '1.21'
author: Daniil
description: Косметика для группы sponsor — свечение, питомцы, партиклы, аксессуары.
softdepend: [TAB, LuckPerms]
commands:
  spons:
    description: GUI спонсорских фишек
    usage: /spons
  glow:
    description: Свечение модели (спонсор)
    usage: /glow <&цвет|rainbow|stop>
    permission: sponsor.glow
  pet:
    description: Питомец-компаньон (спонсор)
    usage: /pet <вид|stop>
    permission: sponsor.pet
  fx:
    description: Партикл-эффекты — шлейфы/ауры/нимбы (спонсор)
    usage: /fx <эффект|stop>
    permission: sponsor.fx
  acc:
    description: Аксессуары-модельки на теле (спонсор)
    usage: /acc <вид|size <n>|off>
    permission: sponsor.acc
permissions:
  sponsor.menu:
    description: Доступ к /spons GUI
    default: false
  sponsor.glow:
    description: Доступ к /glow
    default: false
  sponsor.pet:
    description: Доступ к /pet
    default: false
  sponsor.fx:
    description: Доступ к /fx
    default: false
  sponsor.acc:
    description: Доступ к /acc (аксессуары)
    default: false
